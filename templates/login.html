{% extends 'base.html' %}

{% block content %}
<div class="flex justify-center items-center h-full mt-12">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md border-t-4 border-green-600">
        <h2 class="text-2xl font-bold text-center text-green-700 mb-6">Masuk ke Sistem</h2>
        <form action="{{ url_for('login') }}" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" name="username" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500 outline-none transition">
            </div>
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md transition shadow-md">
                Login
            </button>
        </form>
    </div>
</div>
{% endblock %}
